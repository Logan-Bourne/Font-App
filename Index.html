<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Creator</title>
  <style>
    .main-box {
      width:1000px;
      height: 800px;
      padding: 20px;
      align-items: center;
      margin: 10px;
      background-color: hsl(0, 1%, 58%); 
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: hsl(0, 1%, 58%);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .FC {
      width: 1000px;
      height: 800px;
      padding: 20px;
      /* removed invalid align-items declaration */
      margin: 10px;
      background-color: hsl(0, 1%, 58%); 
    }
  </style>
</head>
<body>
  <h1 class="container">Font Creator</h1>
  <h2 class="main-box">Draw Your Letter</h2>
  <h3>Font Complete</h3>
  <p>Type text to preview and export with your custom font:</p>
</body>
</html>
